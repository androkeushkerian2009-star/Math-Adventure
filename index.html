<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #69b85f;
        }

        /* Ground */
        #map {
            width: 2000px;
            height: 1200px;
            position: absolute;
            left: 0;
            top: 0;
            background:
                repeating-linear-gradient(
                    45deg,
                    #69b85f,
                    #69b85f 40px,
                    #63af59 40px,
                    #63af59 80px
                );
        }

        /* Player */
        #player {
            width: 45px;
            height: 45px;
            position: absolute;
            left: 500px;
            top: 300px;
            background: #3498db;
            border: 4px solid white;
            border-radius: 50%;
            z-index: 10;
        }

        /* NPC */
        #npc {
            width: 45px;
            height: 60px;
            position: absolute;
            left: 700px;
            top: 300px;
            background: #9b59b6;
            border: 4px solid white;
            border-radius: 12px;
            z-index: 5;
        }

        #npc::before {
            content: "👨‍🏫";
            position: absolute;
            font-size: 30px;
            left: 4px;
            top: 8px;
        }

        /* Quest box */
        #quest {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-width: 90%;
            padding: 25px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            z-index: 100;
        }

        #quest h2 {
            margin-top: 0;
        }

        #answer {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 18px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Instructions */
        #instructions {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 10px;
            z-index: 50;
        }
    </style>
</head>

<body>

<div id="game">

    <div id="map">
        <div id="player"></div>
        <div id="npc"></div>
    </div>

    <div id="instructions">
        🎮 Move with <b>WASD</b> or <b>Arrow Keys</b><br>
        Walk to the teacher and press <b>E</b>
    </div>

    <div id="quest">
        <h2>🧮 Math Quest</h2>

        <p>Solve this equation:</p>

        <h2>3 × 4 + 2 = ?</h2>

        <input id="answer" type="number" placeholder="Your answer">

        <button onclick="checkAnswer()">Submit</button>

        <div id="message"></div>
    </div>

</div>

<script>
    const player = document.getElementById("player");
    const npc = document.getElementById("npc");
    const quest = document.getElementById("quest");
    const answer = document.getElementById("answer");
    const message = document.getElementById("message");

    let playerX = 500;
    let playerY = 300;

    const speed = 5;

    const keys = {};

    document.addEventListener("keydown", function(event) {
        keys[event.key.toLowerCase()] = true;

        if (event.key.toLowerCase() === "e") {
            checkNPC();
        }
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    });

    function gameLoop() {

        if (keys["w"] || keys["arrowup"]) {
            playerY -= speed;
        }

        if (keys["s"] || keys["arrowdown"]) {
            playerY += speed;
        }

        if (keys["a"] || keys["arrowleft"]) {
            playerX -= speed;
        }

        if (keys["d"] || keys["arrowright"]) {
            playerX += speed;
        }

        // Keep player inside the map
        playerX = Math.max(0, Math.min(1955, playerX));
        playerY = Math.max(0, Math.min(1155, playerY));

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        requestAnimationFrame(gameLoop);
    }

    function checkNPC() {

        const distance = Math.sqrt(
            Math.pow(playerX - 700, 2) +
            Math.pow(playerY - 300, 2)
        );

        if (distance < 100) {
            quest.style.display = "block";
            answer.focus();
        }
    }

    function checkAnswer() {

        const userAnswer = Number(answer.value);

        if (userAnswer === 14) {
            message.textContent = "✅ Correct! Quest completed! +10 XP";
            message.style.color = "green";
        } else {
            message.textContent = "❌ Not quite! Try again.";
            message.style.color = "red";
        }
    }

    gameLoop();
</script>

</body>
</html>
